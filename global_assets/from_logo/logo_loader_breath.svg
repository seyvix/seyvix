    <filter id="loader-glow" x="0" y="147.53" width="658" height="332" filterUnits="userSpaceOnUse">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur result="blur" stdDeviation="16"/>
      <feFlood flood-color="#693ae2" flood-opacity=".42"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="loader-wave-morph" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.028" numOctaves="2" seed="8" result="noise">
        <animate attributeName="baseFrequency" dur="5.2s" repeatCount="indefinite"
