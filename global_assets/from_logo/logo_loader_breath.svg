      </feDisplacementMap>
    </filter>

    <style><![CDATA[
      :root { color-scheme: dark; }
      #logo-loader { overflow: visible; }

      .loader-wrap {
        transform-box: view-box;
        transform-origin: 329px 313.44px;
        animation: loader-breath 4.2s ease-in-out infinite;
        will-change: transform, opacity, filter;
      }

      .loader-fill-base {
        fill: url(#_Безымянный_градиент_347);
        filter: url(#loader-glow);
        opacity: 1;
      }

      .loader-wave {
        fill: url(#_Безымянный_градиент_347);
        filter: url(#loader-wave-morph);
        opacity: .32;
        transform-box: view-box;
        transform-origin: 329px 313.44px;
        animation: loader-soft-wave 4.2s ease-in-out infinite;
      }

      .loader-shimmer {
        fill: #ffffff;
        opacity: .08;
        mix-blend-mode: screen;
        animation: loader-soft-wave 4.2s ease-in-out infinite;
      }

      @keyframes loader-breath {
        0%   { transform: scale(.985); opacity: .28; filter: brightness(.8); }
        18%  { opacity: .72; }
        42%  { transform: scale(1.025); opacity: 1; filter: brightness(1.08); }
        58%  { transform: scale(1.018); opacity: .96; filter: brightness(1); }
        82%  { opacity: .38; }
        100% { transform: scale(.985); opacity: .28; filter: brightness(.8); }
      }

      @keyframes loader-soft-wave {
        0%   { transform: translateX(-650px); opacity: 0; }
        22%  { opacity: .18; }
        50%  { transform: translateX(0); opacity: .36; }
        78%  { opacity: .14; }
        100% { transform: translateX(650px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-wrap, .loader-wave, .loader-shimmer { animation: none; }
        .loader-wrap { transform: none; opacity: 1; filter: none; }
        .loader-wave, .loader-shimmer { opacity: 0; }
      }
    ]]></style>
  </defs>

