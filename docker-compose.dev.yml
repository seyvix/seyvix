# Development override: hot reload, bind-mounted sources, Vite dev server, no Caddy.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   (or simply `make dev`)
#
# Web UI: http://localhost:5173 (Vite proxies /api to the api service)
# API:    http://localhost:8000/api/v1/docs
# DB:     localhost:5432 (bound to 127.0.0.1)

x-dev-environment: &dev-environment
  APP_ENV: development
  PUBLIC_URL: http://localhost:${WEB_PORT:-5173}
  TELEGRAM_DEV_LOGIN_ENABLED: ${TELEGRAM_DEV_LOGIN_ENABLED:-true}
  # The dev-login user (TELEGRAM_DEV_USER_ID, 777001 by default) is an admin locally.
  ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-777001}

x-dev-backend: &dev-backend
  image: seyvix/backend-dev:local
  environment: *dev-environment
  volumes:
    - ./backend:/app

services:
  caddy:
    profiles: ["edge"]

  api:
    <<: *dev-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  migrate:
    <<: *dev-backend

  worker:
    <<: *dev-backend

  snapshot-worker:
    <<: *dev-backend
    build: !reset null
    command: ["python", "-m", "app.worker", "snapshots"]

  web:
    image: seyvix/web-dev:local
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      # node_modules from the image; refresh after package changes with `up --build -V web`.
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  telegram-bot:
    volumes:
      - ./telegram-bot/telegram_bot:/app/telegram_bot

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
