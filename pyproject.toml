[project]
name = "api"
version = "0.1.0"
description = "Modular FastAPI backend for content processing, search, vectorization, and LLM integrations."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "orjson>=3.11.8",
    "pluggy>=1.6.0",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "pymupdf>=1.25.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.46.0",
    "faststream[rabbit]>=0.6.7",
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
exclude = ["^tests/"]
