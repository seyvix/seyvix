[project]
name = "backend"
version = "0.1.0"
description = "Modular FastAPI backend for content processing, search, vectorization, and LLM integrations."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.136.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "orjson>=3.11.8",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "playwright>=1.52.0",
    "pymupdf>=1.25.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.46.0",
    "minio>=7.2.20",
    "pgvector>=0.4.2",
    "cryptography>=48.0.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC109: `timeout` params are an explicit, documented API here.
# ASYNC240: flags cheap metadata calls (stat/mkdir/glob on temp dirs); real file I/O in async
# code is still caught by ASYNC230 and goes through asyncio.to_thread.
ignore = ["ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
# conftest must set env vars before the app (and its settings) is imported.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
