[project]
name = "telegram-bot"
version = "0.1.0"
description = "Standalone Telegram ingest service for Seyvix."
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.27,<4",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["telegram_bot"]
