name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede outdated PR runs; never cancel a main run (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.8.24"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seyvix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seyvix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/seyvix_test

  telegram-bot:
    name: Telegram bot (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: telegram-bot/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check telegram_bot tests
      - run: uv run pytest

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Compose and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: ci
          TELEGRAM_BOT_TOKEN: ci
          TELEGRAM_INTERNAL_TOKEN: ci
        run: |
          cp .env.example .env
          docker compose --profile telegram config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile telegram config --quiet
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  images:
    name: Publish ${{ matrix.name }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, telegram-bot, web, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            file: backend/Dockerfile
            target: api
          - name: worker-snapshots
            file: backend/Dockerfile
            target: worker-snapshots
          - name: web
            file: web/Dockerfile
            target: caddy
          - name: telegram-bot
            file: telegram-bot/Dockerfile
            target: bot
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name} (see README: CI/CD)"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host server
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          EOF
      - name: Upload compose file and scripts
        run: |
          remote_path=$(printf '%q' "${DEPLOY_PATH:-/opt/seyvix}")
          # shellcheck disable=SC2029 # expanded locally on purpose (%q-quoted)
          tar -cz docker-compose.yml .env.example scripts \
            | ssh server "mkdir -p -- ${remote_path} && tar -xz -C ${remote_path}"
      - name: Pull images and restart (fails if any service is unhealthy)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote_path=$(printf '%q' "${DEPLOY_PATH:-/opt/seyvix}")
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          actor=$(printf '%q' "$GITHUB_ACTOR")
          # shellcheck disable=SC2029 # expanded locally on purpose (%q-quoted)
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh server "cd ${remote_path} && REGISTRY_USER=${actor} scripts/deploy.sh ${GITHUB_SHA} ${prefix}"
