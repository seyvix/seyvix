name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: seyvix-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vkr_api
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vkr_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: backend
            path: backend
          - name: telegram-bot
            path: telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project.path }}/uv.lock

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        working-directory: ${{ matrix.project.path }}
        run: uv sync --frozen --python "$PYTHON_VERSION"

      - name: Pytest
        working-directory: ${{ matrix.project.path }}
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vkr_api
          TELEGRAM_BOT_TOKEN: 123456:test-bot-token
        run: uv run pytest

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  build-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs:
      - python
      - web
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: backend/Dockerfile
            target: production
          - name: web
            dockerfile: web/Dockerfile
            target: production
          - name: telegram-bot
            dockerfile: telegram-bot/Dockerfile
            target: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image names
        shell: bash
        run: |
          repository_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=${REGISTRY}/${repository_lc}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs:
      - build-images
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare deployment variables
        shell: bash
        run: |
          repository_lc="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_prefix="${REGISTRY}/${repository_lc}"
          {
            echo "BACKEND_IMAGE=${image_prefix}/backend:${GITHUB_SHA}"
            echo "WEB_IMAGE=${image_prefix}/web:${GITHUB_SHA}"
            echo "TELEGRAM_BOT_IMAGE=${image_prefix}/telegram-bot:${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          case "$DEPLOY_PATH" in
            *"'"*)
              echo "::error::DEPLOY_PATH cannot contain a single quote"
              exit 1
              ;;
          esac

      - name: Install SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/seyvix_deploy_key
          chmod 600 ~/.ssh/seyvix_deploy_key

          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Copy compose files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          deploy_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_port="${DEPLOY_PORT:-22}"
          tar -czf /tmp/seyvix-deploy.tgz \
            docker-compose.yml \
            docker-compose.deploy.yml \
            docker/nginx/default.conf.template

          ssh -i ~/.ssh/seyvix_deploy_key -p "$deploy_port" "$deploy_target" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/seyvix_deploy_key -P "$deploy_port" /tmp/seyvix-deploy.tgz \
            "$deploy_target:/tmp/seyvix-deploy.tgz"
          ssh -i ~/.ssh/seyvix_deploy_key -p "$deploy_port" "$deploy_target" \
            "tar -xzf /tmp/seyvix-deploy.tgz -C '$DEPLOY_PATH' && rm -f /tmp/seyvix-deploy.tgz"

      - name: Pull images and restart stack
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          deploy_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/seyvix_deploy_key -p "$deploy_port" "$deploy_target" \
            "DEPLOY_PATH='$DEPLOY_PATH' \
             BACKEND_IMAGE='$BACKEND_IMAGE' \
             WEB_IMAGE='$WEB_IMAGE' \
             TELEGRAM_BOT_IMAGE='$TELEGRAM_BOT_IMAGE' \
             GHCR_USERNAME='${{ github.actor }}' \
             GHCR_TOKEN='${{ github.token }}' \
             bash -se" <<'REMOTE'
          cd "$DEPLOY_PATH"
          test -f .env || {
            echo "Missing $DEPLOY_PATH/.env on the server"
            exit 1
          }

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          export BACKEND_IMAGE WEB_IMAGE TELEGRAM_BOT_IMAGE
          compose_files="-f docker-compose.yml -f docker-compose.deploy.yml"
          docker compose $compose_files pull
          docker compose $compose_files up -d --no-build --remove-orphans
          docker image prune -f
          REMOTE
