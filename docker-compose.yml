# Seyvix production stack (also used locally: `docker compose up --build`).
#
#   build locally:  docker compose build
#   server:         IMAGE_TAG=<sha> docker compose pull && docker compose up -d --no-build --wait
#
# Configuration comes from ./.env (see .env.example). Only caddy publishes ports.
name: seyvix

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend: &backend
  <<: *hardening
  image: ${IMAGE_PREFIX:-seyvix}/api:${IMAGE_TAG:-local}
  env_file: .env
  environment: &backend-environment
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CONTENT_STORAGE_ROOT: /data/content
  volumes:
    - storage:/data/content
  init: true
  restart: unless-stopped
  logging: *logging

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-worker-healthcheck: &worker-healthcheck
  # The supervisor touches this file every 15 s while its loops are alive.
  test: ["CMD-SHELL", "test -n \"$(find /tmp/seyvix-worker.heartbeat -mmin -1 2>/dev/null)\""]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  caddy:
    image: ${IMAGE_PREFIX:-seyvix}/web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-110MB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    depends_on: *after-migrate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    mem_limit: 448m
    stop_grace_period: 25s

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    volumes: []
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker", "vectorization", "tags", "taxonomy", "maintenance"]
    depends_on: *after-migrate
    healthcheck: *worker-healthcheck
    mem_limit: 384m
    stop_grace_period: 40s

  snapshot-worker:
    <<: *backend
    image: ${IMAGE_PREFIX:-seyvix}/worker-snapshots:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker-snapshots
    depends_on: *after-migrate
    healthcheck: *worker-healthcheck
    mem_limit: 1536m
    # Lower CPU weight than the API under contention (Chromium/LibreOffice are bursty).
    cpu_shares: 512
    stop_grace_period: 40s

  telegram-bot:
    <<: *hardening
    profiles: ["telegram"]
    image: ${IMAGE_PREFIX:-seyvix}/telegram-bot:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    # Explicit env: the bot needs no database or JWT secrets.
    environment:
      # Required by the bot itself (it exits with a clear error when they are empty).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      BACKEND_URL: http://api:8000/api/v1
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_GROUP_WINDOW_SECONDS: ${TELEGRAM_GROUP_WINDOW_SECONDS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    init: true
    mem_limit: 192m
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seyvix}
      POSTGRES_USER: ${POSTGRES_USER:-seyvix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Tuned for a 4 GB host shared with the app (see README).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - idle_in_transaction_session_timeout=5min
      - -c
      - log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
