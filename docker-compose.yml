x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: production

x-backend-env: &backend-env
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    SEARCH_ENGINE: meilisearch
    SEARCH_MEILISEARCH_URL: http://meilisearch:7700

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  minio:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  meilisearch:
    condition: service_healthy

x-telegram-bot-env: &telegram-bot-env
  env_file:
    - .env
  environment:
    TELEGRAM_BACKEND_BASE_URL: http://backend:8000/api/v1

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_SERVER_NAME: ${APP_SERVER_NAME:-_}
      WEB_SERVER_NAME: ${WEB_SERVER_NAME:-web.localhost}
      API_SERVER_NAME: ${API_SERVER_NAME:-api.localhost}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-web:80}
      API_UPSTREAM: ${API_UPSTREAM:-backend:8000}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100m}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started

  web:
    image: ${WEB_IMAGE:-seyvix-web:local}
    build:
      context: .
      dockerfile: web/Dockerfile
      target: production
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://127.0.0.1/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on: *backend-depends
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  outbox-publisher:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m app.workers.run.outbox

  snapshot-worker:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on: *backend-depends
    command: python -m app.workers.run.snapshot

  vectorization-worker:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: python -m app.workers.run.vectorization

  taxonomy-worker:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m app.workers.run.taxonomy

  tags-worker:
    <<: *backend-env
    image: ${BACKEND_IMAGE:-seyvix-backend:local}
    build: *backend-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python -m app.workers.run.tags

  telegram-bot:
    <<: *telegram-bot-env
    image: ${TELEGRAM_BOT_IMAGE:-seyvix-telegram-bot:local}
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkr_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vkr_api}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio-password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: curl -f http://127.0.0.1:9000/minio/health/live || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio-password}
      S3_BUCKET: ${S3_BUCKET:-app-storage}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb --ignore-existing local/$${S3_BUCKET};
      "

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  meilisearch_data:
